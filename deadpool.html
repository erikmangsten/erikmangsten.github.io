      setInterval(
        () =>
          (document.title = `DEADPOOL · ${Math.floor(Date.now() / 1000) - from}`),
        100,
      );

      document.getElementById("secret-bg").textContent = ciphertext.repeat(10);

      const content = document.querySelector("#content");
      sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const el = (tag, cls) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        return e;
      };

      async function addText(elem, text, delay = 5) {
        if (!text) return;
        for (const char of text) {
          elem.textContent += char;
          await sleep(delay);
        }
      }

      async function renderPool() {
        const pool = content.appendChild(el("div"));
        pool.id = "dp";
        pool.append(el("br"));
        for (const p of dp2026.pool) {
          const participant = el("div", "bet-title"),
            dp = el("div"),
            bubble = el("div", "bet-price");
          pool.append(participant, dp, bubble, el("br"));
          addText(participant, p.participant);
          await sleep(30);
          addText(dp, p.dp);
          await sleep(30);
          addText(bubble, p.bubble);
          await sleep(30);
        }
        const footer = el("footer");
        pool.append(el("div"), footer);
        footer.append(el("br"));
        await sleep(30);
        const copyright = el("span");
        footer.appendChild(copyright);
        addText(copyright, dp2026.copyright);
      }

      async function renderBets() {
        const bets = content.appendChild(el("div"));
        bets.id = "dp";
        bets.append(el("br"));
        const title = el("div", "bet-title");
        bets.appendChild(title);
        addText(title, dp2026.rulesTitle);
        await sleep(30);
        const rules = el("ul");
        bets.appendChild(rules);
        for (const r of dp2026.rules) {
          const rule = el("li");
          rules.appendChild(rule);
          addText(rule, r);
          await sleep(30);
        }
        bets.append(el("br"), el("div"), el("br"));
        for (const b of dp2026.bets) {
          const bet = el("div"),
            t = el("div", "bet-title"),
            desc = el("div", "bet-desc"),
            price = el("div", "bet-price");
          bet.append(t, desc, price);
          bets.append(bet, el("br"));
          addText(t, b.title);
          await sleep(30);
          addText(desc, b.desc);
          await sleep(30);
          addText(price, b.price);
          await sleep(30);
        }
        const footer = el("footer");
        bets.append(el("div"), footer);
        footer.append(el("br"));
        await sleep(30);
        const copyright = el("span");
        footer.appendChild(copyright);
        addText(copyright, dp2026.copyright);
      }

      me("#gate").on("submit", async (e) => {
        e.preventDefault();

        const pass = me("#password").value;

        if (!pass) {
          console.log({ pass });
          me("#gate").style.backgroundColor = "#ff0000";
          return;
        }

        decrypt();
        if (Object.keys(dp2026).length === 0) return;

        document.getElementById("gate").style.display = "none";
        content.innerHTML = "";
        content.append(el("br"), el("div"), el("br"));
        await sleep(30);

        const tabs = el("div", "tabs");
        content.appendChild(tabs);
        for (const [i, n] of dp2026.nav.entries()) {
          const tab = n.href
            ? Object.assign(el("a"), { href: n.href })
            : el("button");
          tab.id = n.label;
          tab.className = i === 0 ? "btn active" : "btn";
          tabs.appendChild(tab);
          const start = el("span"),
            label = el("span", "lbl"),
            end = el("span");
          tab.append(start, label, end);
          await addText(start, "[");
          await addText(label, n.label);
          await addText(end, "]");
          await sleep(30);
        }
        content.append(el("br"), el("div"));
        await sleep(30);

        me("button#POOL").on("click", async () => {
          me("#dp")?.remove();
          me("button#POOL").classList.add("active");
          me("button#BETS").classList.remove("active");
          await renderPool();
        });
        me("button#BETS").on("click", async () => {
          me("#dp")?.remove();
          me("button#POOL").classList.remove("active");
          me("button#BETS").classList.add("active");
          await renderBets();
        });
        await renderPool();
      });

      function encrypt(obj, pw) {
        const text = JSON.stringify(obj);
        const encrypted = CryptoJS.AES.encrypt(text, pw).toString();
        console.log(`encrypted with: '${pw}'. text:`);
        console.log(encrypted);
      }

      function decrypt(pass) {
        const pw = pass ?? document.getElementById("password").value;

        try {
          const bytes = CryptoJS.AES.decrypt(ciphertext, pw);
          const decryptedText = bytes.toString(CryptoJS.enc.Utf8);
          if (!decryptedText) {
            throw new Error("no decryptedText");
          }
          const obj = JSON.parse(decryptedText);
          dp2026 = obj;
        } catch (e) {
          const wrap = me(".wrapper");
          wrap.textContent = "";
          const img = wrap.appendChild(el("img"));
          img.src = "images/dp3.png";
        }
      }
   </script>
