<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafaf8;
      color: #1a1a1a;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e8e8e4;
      padding: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 0.4rem;
      color: #666;
      font-size: 0.95rem;
    }

    main {
      max-width: 800px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: #fff;
      border: 1px solid #e8e8e4;
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.15s, transform 0.15s;
    }

    .card:hover {
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: #f0ede8;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #bbb;
      font-size: 2.5rem;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 1.1rem 1.25rem 1.25rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .card-desc {
      font-size: 0.88rem;
      color: #555;
      line-height: 1.5;
      flex: 1;
    }

    .card-date {
      font-size: 0.78rem;
      color: #999;
      margin-top: 0.5rem;
    }

    .empty {
      text-align: center;
      color: #999;
      margin-top: 4rem;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Recept</h1>
    <p>Några saker som är goda sådär.</p>
  </header>
  <main>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>No recipes yet.</p>
  </main>

  <script>
    async function load() {
      const res = await fetch('manifest.json');
      const recipes = await res.json();
      const grid = document.getElementById('grid');
      const empty = document.getElementById('empty');

      if (!recipes.length) { empty.hidden = false; return; }

      for (const r of recipes) {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = `view.html?recipe=${r.slug}`;

        let thumbHTML;
        if (r.thumb) {
          thumbHTML = `<div class="card-thumb"><img src="${r.slug}/${r.thumb}" alt="${r.title}" loading="lazy"></div>`;
        } else {
          thumbHTML = `<div class="card-thumb">🍽</div>`;
        }

        const date = r.date ? new Date(r.date).toLocaleDateString('en-SE', { year:'numeric', month:'long', day:'numeric' }) : '';

        a.innerHTML = `
          ${thumbHTML}
          <div class="card-body">
            <div class="card-title">${r.title}</div>
            <div class="card-desc">${r.description || ''}</div>
            ${date ? `<div class="card-date">${date}</div>` : ''}
          </div>
        `;
        grid.appendChild(a);
      }
    }

    load().catch(err => {
      document.getElementById('empty').hidden = false;
      console.error(err);
    });
  </script>
</body>
</html>
