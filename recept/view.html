<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafaf8;
      color: #1a1a1a;
      min-height: 100vh;
    }

    nav {
      padding: 1rem 2rem;
      border-bottom: 1px solid #e8e8e4;
      background: #fff;
    }

    nav a {
      font-size: 0.88rem;
      color: #666;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    nav a:hover { color: #1a1a1a; }

    .content {
      max-width: 700px;
      margin: 2.5rem auto;
      padding: 0 1.5rem 4rem;
    }

    /* markdown rendering */
    .prose h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.5px; }
    .prose h2 { font-size: 1.3rem; font-weight: 600; margin-top: 2rem; margin-bottom: 0.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid #e8e8e4; }
    .prose h3 { font-size: 1.05rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.5rem; }
    .prose p { line-height: 1.75; margin-bottom: 1rem; color: #222; }
    .prose ul, .prose ol { padding-left: 1.5rem; margin-bottom: 1rem; }
    .prose li { line-height: 1.75; margin-bottom: 0.3rem; }
    .prose strong { font-weight: 600; }
    .prose em { font-style: italic; }
    .prose code { font-family: monospace; background: #f0ede8; padding: 0.15em 0.4em; border-radius: 3px; font-size: 0.88em; }
    .prose pre { background: #f0ede8; padding: 1rem; border-radius: 6px; overflow-x: auto; margin-bottom: 1rem; }
    .prose pre code { background: none; padding: 0; }
    .prose blockquote { border-left: 3px solid #d4cfc9; padding-left: 1rem; color: #666; margin-bottom: 1rem; font-style: italic; }
    .prose hr { border: none; border-top: 1px solid #e8e8e4; margin: 2rem 0; }
    .prose table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; font-size: 0.92rem; }
    .prose th, .prose td { border: 1px solid #e8e8e4; padding: 0.5rem 0.75rem; text-align: left; }
    .prose th { background: #f5f3f0; font-weight: 600; }

    .prose img {
      max-width: 100%;
      border-radius: 8px;
      margin: 1rem 0;
      display: block;
    }

    .error {
      text-align: center;
      color: #999;
      margin-top: 4rem;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">&#8592; All recipes</a>
  </nav>
  <div class="content">
    <div class="prose" id="prose"></div>
    <p class="error" id="error" hidden>Recipe not found.</p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const slug = params.get('recipe');

    if (!slug) {
      document.getElementById('error').hidden = false;
    } else {
      fetch(`${slug}/recipe.md`)
        .then(res => {
          if (!res.ok) throw new Error('not found');
          return res.text();
        })
        .then(md => {
          // rewrite relative image/link src to include the slug prefix
          const html = marked.parse(md);
          const div = document.createElement('div');
          div.innerHTML = html;
          div.querySelectorAll('img').forEach(img => {
            const src = img.getAttribute('src');
            if (src && !src.startsWith('https') && !src.startsWith('/') && !src.startsWith('data:')) {
              img.src = `${slug}/${src}`;
            }
          });
          document.getElementById('prose').innerHTML = div.innerHTML;

          // set page title from first h1 if present
          const h1 = document.querySelector('.prose h1');
          if (h1) document.title = h1.textContent + ' — Recipes';
        })
        .catch(() => {
          document.getElementById('error').hidden = false;
        });
    }
  </script>
</body>
</html>
